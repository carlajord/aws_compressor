[project]
name = "oidpipe"
version = "0.1.0"
description = "OID Compressor Copilot — end-to-end ML pipeline on AWS"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "plotly>=5.22",
    "streamlit>=1.37",
    "boto3>=1.34",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "cognite-sdk>=7.50",
    "python-dotenv>=1.2.4",
    "ipykernel>=7.4.0",
    "nbformat>=5.11.1",
    "openai>=3.39.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.5",
    "mypy>=1.11",
    "moto[s3]>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oidpipe"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["oidpipe"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
